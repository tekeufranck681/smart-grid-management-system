global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ---------------- Prometheus metrics ----------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # ---------------- Node Exporter (host metrics) ----------------
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']  # Docker Desktop host

  # ---------------- Traefik metrics ----------------
  - job_name: 'traefik'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['traefik:80']  # internal Docker DNS name, Traefik exposes metrics on 80 by default

  # ---------------- FastAPI app metrics ----------------
  - job_name: 'auth'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth:8000']  # internal Docker DNS name

  - job_name: 'workspace-grid'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['workspace-grid:8000']  # internal Docker DNS name

  - job_name: 'scenario-management'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['scenario-management:8000']  # internal Docker DNS name
