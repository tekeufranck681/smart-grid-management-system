openapi: 3.1.0
info:
  title: SGMS Scenario Management Microservice API
  version: 1.0.0
paths:
  /:
    get:
      summary: Welcome
      description: Welcome message endpoint.
      operationId: welcome__get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Welcome  Get
  /api/v1/scenarios/{grid_id}:
    post:
      tags:
        - Scenarios
      summary: Create Scenario
      description: |-
        Create a new scenario from a base grid.

        - Copies full grid data into an immutable snapshot
        - Does NOT create events
        - Scenario starts in DRAFT status
      operationId: create_scenario_api_v1_scenarios__grid_id__post
      parameters:
        - name: grid_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Grid Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioOut"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/scenarios/{scenario_id}/events:
    post:
      tags:
        - Scenarios
      summary: Add Scenario Event
      operationId: add_scenario_event_api_v1_scenarios__scenario_id__events_post
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioEventCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioEventOut"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/scenarios/{grid_id}/list:
    get:
      tags:
        - Scenarios
      summary: List Scenarios By Grid
      operationId: list_scenarios_by_grid_api_v1_scenarios__grid_id__list_get
      parameters:
        - name: grid_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Grid Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioListOut"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/scenarios/{scenario_id}:
    get:
      tags:
        - Scenarios
      summary: View Scenario
      description: |-
        Fetch scenario with read-only grid snapshot and events.
        Frontend can render scenario topology.
      operationId: view_scenario_api_v1_scenarios__scenario_id__get
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioDetailOut"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Scenarios
      summary: Delete Scenario
      operationId: delete_scenario_api_v1_scenarios__scenario_id__delete
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/scenarios/{scenario_id}/status:
    patch:
      tags:
        - Scenarios
      summary: Update Scenario Status
      operationId: update_scenario_status_api_v1_scenarios__scenario_id__status_patch
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Scenario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdateStatus"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioDetailOut"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    EventType:
      type: string
      enum:
        - LOAD_CHANGE
        - LINE_OUTAGE
        - GENERATION_CHANGE
        - LOAD_SHEDDING
        - ISLANDING
      title: EventType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScenarioCreate:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
        - name
      title: ScenarioCreate
    ScenarioDetailOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
        base_grid_id:
          type: string
          format: uuid
          title: Base Grid Id
        status:
          $ref: "#/components/schemas/ScenarioStatus"
        created_by:
          type: string
          format: uuid
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        grid_snapshot:
          $ref: "#/components/schemas/ScenarioGridSnapshotOut"
        events:
          items:
            $ref: "#/components/schemas/ScenarioEventOut"
          type: array
          title: Events
      type: object
      required:
        - id
        - name
        - workspace_id
        - base_grid_id
        - status
        - created_by
        - created_at
        - grid_snapshot
      title: ScenarioDetailOut
    ScenarioEventCreate:
      properties:
        event_type:
          $ref: "#/components/schemas/EventType"
        target_type:
          $ref: "#/components/schemas/TargetType"
        target_id:
          type: string
          format: uuid
          title: Target Id
        parameters:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Parameters
        start_time:
          type: string
          format: date-time
          title: Start Time
        duration:
          type: string
          format: duration
          title: Duration
      type: object
      required:
        - event_type
        - target_type
        - target_id
        - start_time
        - duration
      title: ScenarioEventCreate
    ScenarioEventOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        scenario_id:
          type: string
          format: uuid
          title: Scenario Id
        event_type:
          $ref: "#/components/schemas/EventType"
        target_type:
          $ref: "#/components/schemas/TargetType"
        target_id:
          type: string
          format: uuid
          title: Target Id
        parameters:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Parameters
        start_time:
          type: string
          format: date-time
          title: Start Time
        duration:
          type: string
          format: duration
          title: Duration
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - scenario_id
        - event_type
        - target_type
        - target_id
        - start_time
        - duration
        - created_at
      title: ScenarioEventOut
    ScenarioGridSnapshotOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        scenario_id:
          type: string
          format: uuid
          title: Scenario Id
        nodes:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Nodes
        edges:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Edges
        grid_metadata:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Grid Metadata
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - scenario_id
        - nodes
        - edges
        - created_at
      title: ScenarioGridSnapshotOut
    ScenarioListItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        status:
          $ref: "#/components/schemas/ScenarioStatus"
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - name
        - status
        - created_at
      title: ScenarioListItem
    ScenarioListOut:
      properties:
        scenarios:
          items:
            $ref: "#/components/schemas/ScenarioListItem"
          type: array
          title: Scenarios
      type: object
      required:
        - scenarios
      title: ScenarioListOut
    ScenarioOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
        base_grid_id:
          type: string
          format: uuid
          title: Base Grid Id
        status:
          $ref: "#/components/schemas/ScenarioStatus"
        created_by:
          type: string
          format: uuid
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - name
        - workspace_id
        - base_grid_id
        - status
        - created_by
        - created_at
      title: ScenarioOut
    ScenarioStatus:
      type: string
      enum:
        - DRAFT
        - LOCKED
        - ARCHIVED
      title: ScenarioStatus
    ScenarioUpdateStatus:
      properties:
        new_status:
          $ref: "#/components/schemas/ScenarioStatus"
      type: object
      required:
        - new_status
      title: ScenarioUpdateStatus
    TargetType:
      type: string
      enum:
        - NODE
        - EDGE
        - ZONE
      title: TargetType
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
